version: '3.9'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data       # SQLite DB persists between restarts
    environment:
      # All three stores live on the mounted volume so they survive rebuilds.
      # The recorded chain data in particular cannot be regenerated.
      - DB_PATH=/app/data/optionslens.db
      - ALERT_ENGINE_DB=/app/data/oi_engine.db
      - MARKET_DATA_DB=/app/data/market_data.db

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
