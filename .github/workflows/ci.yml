# Runs the backend test suite on Linux AND Windows, and builds the frontend.
#
# Windows is not optional here: the project is developed on Linux but run on
# Windows, and two bugs so far only existed there — a glibc-only
# strftime("%s") that took /api/ivrank down, and hardcoded /tmp paths that
# broke 20 tests. Neither was visible from a Linux run.
#
# No test needs a Fyers token or network access, so nothing here needs secrets.

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # There are no frontend tests; a clean build is the check that JSX and
      # imports are intact.
      - run: npm run build
